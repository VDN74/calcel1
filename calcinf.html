<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Разница в %</title>
  <!-- Добавьте этот тег для корректного отображения на мобильных -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: sans-serif;
      max-width: 400px;
      margin: 30px auto;
      padding: 10px;
      background: #f3f3f3;
    }
    input {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px 5px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      background: #71b371;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      padding: 12px;
      background: #fff;
      font-size: 1.2rem;
      text-align: center;
      min-height: 32px;
      border-radius: 4px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <header>
    <ul>
      <li>
        <a href="index.html">Home</a>
      </li>
      <li>
        <a href="calcee.html">calcee</a>
      </li>
      <li>
        <a href="calcinf.html">calcinf</a>
      </li>
      <li>
        <a href="funrandom1.html">funrandom1</a>
      </li>
    </ul>
  </header>
  <h3>На сколько % измененится первое число</h3>
  <input type="number" id="num1" placeholder="Первое число">
  <input type="number" id="num2" placeholder="Второе число">
  <button onclick="calculateSum()">% изменения первого числа</button>
  <div id="result"></div>

  <script>
    function calculateSum() {
      let a = document.getElementById('num1').value;
      let b = document.getElementById('num2').value;
      let result = document.getElementById('result');
      // Проверяем, введены ли числа
      if (a === "" || b === "") {
        result.textContent = "Пожалуйста, введите оба числа!";
        return;
      }
      result.textContent = Math.round(((Number(b) - Number(a)) / Number(a)) * 100 * 10000) / 10000;
    }
  </script>
</body>
</html>
