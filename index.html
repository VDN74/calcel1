<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Расчет расхода электроэнергии</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: sans-serif;
      max-width: 400px;
      margin: 30px auto;
      padding: 10px;
      background: #f3f3f3;
    }
    input {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px 6px;
      font-size: 1rem;
      box-sizing: border-box;
      border: 1px solid #b6b6b6;
      border-radius: 4px;
    }
    label {
      display: block;
      margin-bottom: 3px;
      color: #2b2b2b;
      font-size: 0.98rem;
      font-weight: 500;
      margin-top: 3px;
    }
    .button-row {
      display: flex;
      width: 100%;
      gap: 3%;
      margin-bottom: 24px;
    }
    .button-glossy {
      flex: 1 1 0;
      min-width: 0;
      padding: 10px 0;
      font-size: 1rem;
      background: linear-gradient(180deg,
        #f5f6fa 0%,
        #e3e6eb 9%,
        #c7c7c7 30%,
        #b3b7bb 75%,
        #dddddd 100%);
      color: #353535;
      border: 1.5px solid #b4b4b4;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 0.04em;
      position: relative;
      box-shadow:
        0 4px 18px 0 #bdbdbd80,
        0 1.5px 0 #f8f8f8 inset,
        0 2px 8px #f7f7fa inset;
      text-shadow: 0 1px 0 #fff, 0 0.5px 0 #cacaca;
      overflow: hidden;
      transition: transform 0.09s, box-shadow 0.09s, background 0.13s;
    }
    .button-glossy::before {
      content: '';
      display: block;
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 48%;
      border-radius: 8px 8px 35px 35px / 35px 35px 15px 15px;
      background: linear-gradient(
        180deg,
        rgba(255,255,255,0.85) 0%,
        rgba(255,255,255,0.4) 35%,
        rgba(255,255,255,0.07) 82%,
        rgba(255,255,255,0) 100%
      );
      pointer-events: none;
      z-index: 2;
    }
    .button-glossy:active {
      background: linear-gradient(180deg,
        #f2f2f2 0%,
        #cccccc 34%,
        #bcbcbc 100%);
      box-shadow:
        0 1.5px 3px 0 #bbbbbb7a,
        0 1px 0 #ececec inset;
      color: #222;
      transform: translateY(2px) scale(0.98);
    }
    #result {
      margin: 0;
      padding: 12px;
      background: #fff;
      font-size: 1.18rem;
      text-align: center;
      min-height: 32px;
      border-radius: 4px;
      border: 1px solid #ddd;
      line-height: 1.5;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h2>Расчет расхода электроэнергии</h2>
  <input type="number" id="num1" placeholder="Конечное значение в диапазоне">
  <input type="number" id="num2" placeholder="Начальное значение в диапазоне">

  <label for="koeff">Введите нужный коэффициент:</label>
  <input type="number" id="koeff" placeholder="K по умолчанию = 20000">

  <div class="button-row">
    <button class="button-glossy" onclick="calculateDifference()">Расчет</button>
    <button class="button-glossy" onclick="calculateSum()">Сумма</button>
  </div>

  <div id="result"></div>

  <script>
    function getKoeff() {
      let coeffValue = document.getElementById('koeff').value.trim();
      return coeffValue === "" ? 20000 : Number(coeffValue);
    }

    function calculateDifference() {
      let a = document.getElementById('num1').value.trim();
      let b = document.getElementById('num2').value.trim();
      let result = document.getElementById('result');
      let k = getKoeff();
      if (a === "" || b === "") {
        result.textContent = "Введите оба числа!";
        return;
      }
      let diff = Math.round((Number(a) - Number(b)) * 1000) / 1000;
      let multiplied = Math.round(diff * k * 1000) / 1000;
      result.innerHTML = `${diff}<br>${multiplied}`;
    }

    function calculateSum() {
      let a = document.getElementById('num1').value.trim();
      let b = document.getElementById('num2').value.trim();
      let result = document.getElementById('result');
      if (a === "" || b === "") {
        result.textContent = "Введите оба числа!";
        return;
      }
      let sum = Math.round((Number(a) + Number(b)) * 1000) / 1000;
      result.textContent = `Сумма: ${sum}`;
    }
  </script>
</body>
</html>
